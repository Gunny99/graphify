name: CI

on:
  push:
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  pull_request:
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  workflow_dispatch:

jobs:
  skillgen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install RTK
        uses: ./.github/actions/setup-rtk
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Check generated skill artifacts are up to date
        run: rtk uv run --frozen python -m tools.skillgen --check
      - name: Audit per-host v8 coverage
        run: rtk uv run --frozen python -m tools.skillgen --audit-coverage
      - name: Check the file_type enum is a singleton
        run: rtk uv run --frozen python -m tools.skillgen --schema-singleton
      - name: Round-trip the monoliths against v8
        run: rtk uv run --frozen python -m tools.skillgen --monolith-roundtrip
      - name: Round-trip the always-on blocks against v8
        run: rtk uv run --frozen python -m tools.skillgen --always-on-roundtrip

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install RTK
        uses: ./.github/actions/setup-rtk
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: rtk uv sync --all-extras --frozen
      - name: Run tests
        run: rtk uv run --frozen pytest tests/ -q --tb=short
      - name: Verify install works end-to-end
        run: |
          rtk uv run --frozen graphify --help
          rtk uv run --frozen graphify install

  pi-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install RTK
        uses: ./.github/actions/setup-rtk
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: rtk uv sync --frozen
      - name: Run Pi guard tests
        run: GRAPHIFY_TEST_CLI=$PWD/.venv/bin/graphify rtk test bun test tests/pi.test.ts

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install RTK
        uses: ./.github/actions/setup-rtk
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: rtk uv sync --frozen
      - name: bandit (static security analysis)
        continue-on-error: true
        run: rtk uv run --frozen bandit -r graphify -ll
      - name: pip-audit (dependency vulnerabilities)
        continue-on-error: true
        run: rtk uv run --frozen pip-audit --strict
